spring.application.name=campusevents

# H2 file-based database - data survives restarts
spring.datasource.url=jdbc:h2:file:./data/campusevents
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 web console for inspecting tables at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Allow <form method="post"> with a hidden _method field to act as PUT/DELETE
spring.mvc.hiddenmethod.filter.enabled=true

# Disable template caching while developing
spring.thymeleaf.cache=false

# JWT auth - secret must be a base64-encoded key of at least 256 bits for HS256.
# Local dev only; use an environment-supplied secret in any real deployment.
app.jwt.secret=c3w8aPnluYvDmCgq2+mj02n5L5QIhuaq6cCOXDyv7E4=
app.jwt.expiration-ms=86400000
