<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Not found - CampusEvents</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<main id="main-content" class="error-main">
    <p class="error-code">404</p>
    <h1>Event not found</h1>
    <p class="error-message" th:text="${message}">We couldn't find that event.</p>
    <a class="btn btn-primary" th:href="@{/events}">Back to all events</a>
</main>
</body>
</html>
