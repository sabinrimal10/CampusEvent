<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${event.title} + ' - CampusEvents'">Event - CampusEvents</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<main id="main-content" class="detail-main">
    <nav aria-label="Breadcrumb" class="breadcrumb">
        <a th:href="@{/events}">&larr; Back to all events</a>
    </nav>

    <article class="event-detail-card">
        <header class="event-detail-header">
            <div class="event-detail-heading">
                <span class="full-badge event-detail-full-badge" th:if="${event.isFull()}">Full</span>
                <p class="event-category" th:text="${event.category}">Category</p>
                <h1 th:text="${event.title}">Event title</h1>
            </div>
            <p class="event-host">
                <span class="nav-avatar" aria-hidden="true"
                      th:text="${#strings.substring(event.organizerName, 0, 1)}">O</span>
                Hosted by <span th:text="${event.organizerName}">Organizer</span>
            </p>
        </header>

        <p role="alert" class="alert alert-error" th:if="${bookingError}" th:text="${bookingError}">Error</p>
        <p role="status" class="alert alert-success" th:if="${alreadyBooked and bookingError == null}">
            You're booked for this event.
        </p>

        <dl class="event-facts">
            <dt>When</dt>
            <dd>
                <time th:text="${#temporals.format(event.startTime, 'EEEE, d MMMM yyyy - h:mm a')}"
                      th:datetime="${event.startTime}">Date</time>
            </dd>

            <dt>Where</dt>
            <dd th:text="${event.location}">Location</dd>

            <dt>Capacity</dt>
            <dd>
                <div class="capacity-meter">
                    <div class="capacity-bar" role="progressbar"
                         th:aria-valuenow="${event.bookingCount}" th:aria-valuemax="${event.capacity}">
                        <div class="capacity-bar-fill"
                             th:classappend="${event.isFull()} ? 'full' : (${event.spotsRemaining <= 2} ? 'low' : '')"
                             th:style="'width: ' + ${event.bookingCount * 100.0 / event.capacity} + '%'"></div>
                    </div>
                    <span id="capacity-display" th:text="${event.bookingCount} + ' / ' + ${event.capacity} + ' booked'">0 / 0</span>
                    <button type="button" id="refresh-capacity" class="btn-link">Refresh</button>
                </div>
            </dd>
        </dl>

        <section class="event-description" aria-label="Description">
            <h2>About this event</h2>
            <p th:text="${event.description}">Description</p>
        </section>

        <div class="action-bar">
            <form th:action="@{/events/{id}/book(id=${event.id})}" method="post">
                <button type="submit" class="btn btn-primary" th:disabled="${alreadyBooked or event.isFull()}"
                        th:text="${alreadyBooked} ? 'You are booked' : (${event.isFull()} ? 'Event full' : 'Book this event')">Book</button>
            </form>

            <a sec:authorize="hasRole('ADMIN')" class="btn" th:href="@{/events/{id}/edit(id=${event.id})}">Edit event</a>

            <form sec:authorize="hasRole('ADMIN')" th:action="@{/events/{id}(id=${event.id})}" method="post"
                  onsubmit="return confirm('Cancel this event? This cannot be undone.');">
                <input type="hidden" name="_method" value="delete">
                <button type="submit" class="btn btn-danger">Cancel event</button>
            </form>
        </div>
    </article>
</main>

<footer class="site-footer">
    <p>CampusEvents &mdash; built for CTEC2712</p>
</footer>

<script th:inline="javascript">
    const eventId = /*[[${event.id}]]*/ 0;
    const capacityDisplay = document.getElementById('capacity-display');
    const refreshButton = document.getElementById('refresh-capacity');
    const capacityFill = document.querySelector('.capacity-bar-fill');

    refreshButton.addEventListener('click', () => {
        refreshButton.disabled = true;
        fetch(`/api/events/${eventId}`)
            .then(response => response.json())
            .then(event => {
                capacityDisplay.textContent = `${event.bookingCount} / ${event.capacity} booked`;
                const percent = (event.bookingCount * 100) / event.capacity;
                capacityFill.style.width = `${percent}%`;
                capacityFill.classList.toggle('full', event.full);
                capacityFill.classList.toggle('low', !event.full && (event.capacity - event.bookingCount) <= 2);
            })
            .catch(() => {
                capacityDisplay.textContent = 'Could not refresh capacity';
            })
            .finally(() => {
                refreshButton.disabled = false;
            });
    });
</script>
</body>
</html>
