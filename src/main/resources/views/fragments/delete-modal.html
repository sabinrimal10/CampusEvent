<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Small centred confirmation box. Any button with data-delete-url opens it. -->
<th:block th:fragment="modal">
    <dialog id="delete-modal" class="confirm-modal" aria-labelledby="delete-modal-title">
        <h2 id="delete-modal-title">Delete this event?</h2>
        <p>Are you sure you want to delete <strong id="delete-modal-name">this event</strong>?
           This cannot be undone.</p>
        <form id="delete-modal-form" th:action="@{/events/0}" method="post" class="confirm-modal-actions">
            <input type="hidden" name="_method" value="delete">
            <button type="button" class="btn" id="delete-modal-no">No</button>
            <button type="submit" class="btn btn-danger">Yes, delete</button>
        </form>
    </dialog>
    <script>
        (function () {
            const modal = document.getElementById('delete-modal');
            const form = document.getElementById('delete-modal-form');
            const name = document.getElementById('delete-modal-name');
            document.querySelectorAll('[data-delete-url]').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    form.action = btn.dataset.deleteUrl;
                    name.textContent = btn.dataset.deleteTitle || 'this event';
                    modal.showModal();
                });
            });
            document.getElementById('delete-modal-no').addEventListener('click', function () { modal.close(); });
            modal.addEventListener('click', function (e) { if (e.target === modal) modal.close(); });
        })();
    </script>
</th:block>
</body>
</html>
