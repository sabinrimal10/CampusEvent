# Tests get their own in-memory database - never the dev file-based one in
# ./data, which is often locked by a running `spring-boot:run` instance and
# shouldn't be polluted with test data anyway.
spring.datasource.url=jdbc:h2:mem:campusevents-test;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

